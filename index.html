
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omar & Doaa</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
background:#120904;
font-family:Arial,sans-serif;
overflow-x:hidden;
}

/* envelope */

#start{
position:fixed;
inset:0;
background:#efe1cf;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
overflow:hidden;
}

#start::before{
content:'';
position:absolute;
inset:0;
background:
radial-gradient(circle at top left, rgba(255,255,255,.5), transparent 40%),
radial-gradient(circle at bottom right, rgba(212,161,95,.35), transparent 40%);
animation:move 8s infinite alternate;
}

@keyframes move{
from{transform:translateY(0px)}
to{transform:translateY(-20px)}
}

.envelope{
width:330px;
height:220px;
position:relative;
cursor:pointer;
z-index:5;
}

.left,.right{
position:absolute;
top:0;
width:50%;
height:100%;
background:#d8ae74;
transition:1s;
}

.left{
left:0;
clip-path:polygon(0 0,100% 50%,0 100%);
transform-origin:left;
}

.right{
right:0;
clip-path:polygon(100% 0,0 50%,100% 100%);
transform-origin:right;
}

.center{
position:absolute;
inset:15px;
background:#fff7ee;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
border-radius:12px;
z-index:-1;
}

.center h2{
font-size:40px;
color:#9b745d;
}

.center p{
font-size:22px;
margin-top:10px;
color:#9b745d;
}

.open .left{
transform:rotateY(-140deg);
}

.open .right{
transform:rotateY(140deg);
}

.tap{
margin-top:35px;
font-size:24px;
color:#9b745d;
z-index:2;
}

/* pages */

#main{
display:none;
animation:fade 1.2s;
}

@keyframes fade{
from{opacity:0}
to{opacity:1}
}

.section{
width:100%;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#120904;
}

.section img{
width:100%;
max-width:1000px;
display:block;
}

.motion{
animation:float 5s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0px)}
50%{transform:translateY(-12px)}
100%{transform:translateY(0px)}
}

.music-btn{
position:fixed;
top:20px;
left:20px;
z-index:999;
background:white;
border:none;
padding:14px 20px;
border-radius:50px;
font-size:18px;
cursor:pointer;
}

</style>
</head>

<body>

<div id="start">

<div class="envelope" id="envelope">

<div class="left"></div>

<div class="right"></div>

<div class="center">
<h2>Omar & Doaa</h2>
<p>Tap To Open</p>
</div>

</div>

<div class="tap">
Wedding Invitation
</div>

</div>

<div id="main">

<button class="music-btn" onclick="toggleMusic()">
🎵 Music
</button>

<section class="section">
<img class="motion" src="assets/cover1.png">
</section>

<section class="section">
<img class="motion" src="assets/countdown.png">
</section>

<section class="section">
<img class="motion" src="assets/invitepage.png">
</section>

<section class="section">
<img class="motion" src="assets/location.png">
</section>

</div>

<audio id="music" loop>
<source src="assets/music.mp3" type="audio/mpeg">
</audio>

<script>

const envelope=document.getElementById('envelope');
const start=document.getElementById('start');
const main=document.getElementById('main');
const music=document.getElementById('music');

envelope.onclick=()=>{

envelope.classList.add('open');

music.play();

setTimeout(()=>{
start.style.display='none';
main.style.display='block';
},1200);

}

function toggleMusic(){

if(music.paused){
music.play();
}else{
music.pause();
}

}

</script>

</body>
</html>
